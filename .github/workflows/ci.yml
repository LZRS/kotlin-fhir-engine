name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"

jobs:
  lint-and-compile:
    name: Lint and compile all platforms
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      - name: Check all platforms compile
        run: >
          ./gradlew compileDebugKotlinAndroid :engine:compileAndroidMain compileKotlinDesktop
          compileKotlinJs compileKotlinWasmJs compileKotlinIosArm64 compileKotlinIosSimulatorArm64

  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop
            target: ":engine:desktopTest"
            os: ubuntu-latest
          - name: Android host
            target: ":engine:testAndroidHostTest"
            os: ubuntu-latest
          - name: JS browser
            target: ":engine:jsBrowserTest"
            os: ubuntu-latest
          - name: Wasm browser
            target: ":engine:wasmJsBrowserTest"
            os: ubuntu-latest
          - name: iOS simulator
            target: ":engine:iosSimulatorArm64Test"
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: matrix.name == 'Android host'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew ${{ matrix.target }} "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            engine/build/reports/tests/
            engine/build/test-results/

  android-device-test:
    name: Test Android device
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: ./gradlew :engine:connectedAndroidDeviceTest "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload Android device test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-Android device
          path: |
            engine/build/reports/
            engine/build/outputs/androidTest-results/

  # Skips the benchmarks when the pull request changes nothing they compile.
  benchmark-scope:
    name: Benchmark scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tasks: ${{ steps.tier.outputs.tasks }}

    steps:
      - uses: actions/checkout@v4

      # Read from the API so a re-run sees labels added after the event.
      - name: Choose the tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          mkdir -p reports
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'benchmark:full'; then
            tasks=":engine:benchmark"
          elif gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > reports/changed-files.txt \
              && [ "$(python3 .github/scripts/benchmark_table.py --changed-files reports/changed-files.txt --count-changes)" = 0 ]; then
            tasks=""
          else
            tasks=":engine:prBenchmark :engine:prNoisyBenchmark"
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      # The comment workflow replaces any earlier table with this note.
      - name: Record the skip
        if: steps.tier.outputs.tasks == ''
        run: |
          echo "${{ github.event.number }}" > reports/pr-number.txt
          echo "${{ github.event.pull_request.base.sha }}" > reports/base-sha.txt
          python3 .github/scripts/benchmark_table.py --changed-files reports/changed-files.txt \
            --base-sha "${{ github.event.pull_request.base.sha }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --repository "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the skip
        if: steps.tier.outputs.tasks == ''
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/

  benchmark:
    name: Micro benchmarks
    needs: benchmark-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.benchmark-scope.outputs.tasks != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # On a pull request, base and head run in this one job, because scores from different
      # runners are not comparable. Databases go on tmpfs because runner disk speed is unstable.
      - name: Create a RAM-backed temp directory
        if: github.event_name == 'pull_request'
        run: mkdir -p /dev/shm/benchmarks

      - name: Check out the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # The base may predate the benchmarks; the comment then shows the head alone.
      - name: Run the benchmarks against the base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base
        run: ./gradlew ${{ needs.benchmark-scope.outputs.tasks }} -Pbenchmark.shard=${{ matrix.shard }} -Pbenchmark.tmpdir=/dev/shm/benchmarks "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Run the benchmarks against the head
        if: github.event_name == 'pull_request'
        run: ./gradlew ${{ needs.benchmark-scope.outputs.tasks }} -Pbenchmark.shard=${{ matrix.shard }} -Pbenchmark.tmpdir=/dev/shm/benchmarks "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Run the full tier
        if: github.event_name != 'pull_request'
        run: ./gradlew :engine:benchmark -Pbenchmark.shard=${{ matrix.shard }} "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Fork pull requests leave workflow_run.pull_requests empty; the artifact carries the number.
      - name: Collect reports
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p reports/head reports/base
          cp -r engine/build/reports/benchmarks/. reports/head/ 2>/dev/null || true
          cp -r base/engine/build/reports/benchmarks/. reports/base/ 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.number }}" > reports/pr-number.txt
            echo "${{ github.event.pull_request.base.sha }}" > reports/base-sha.txt
            gh pr diff "${{ github.event.number }}" --repo "$GITHUB_REPOSITORY" --name-only \
              > reports/changed-files.txt || rm -f reports/changed-files.txt
          fi

      - name: Record the machine
        if: always()
        run: |
          {
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-}"
            echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME") $(uname -r)"
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|L3 cache):'
            free -h | awk '/^Mem:/ {print "Memory: " $2}'
            java -version 2>&1 | head -n 1
          } > reports/machine.txt
          cat reports/machine.txt

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-shard-${{ matrix.shard }}
          path: reports/

  # Merges the shards into the one artifact the comment workflow reads.
  benchmark-report:
    name: Micro benchmark report
    needs: benchmark
    if: ${{ !cancelled() && needs.benchmark.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Download the shards
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-shard-*
          path: shards

      - name: Merge the shards
        run: |
          mkdir -p reports/head reports/base
          for shard in shards/*/; do
            name=$(basename "$shard")
            mkdir -p "reports/head/$name" "reports/base/$name"
            cp -r "$shard/head/." "reports/head/$name/" 2>/dev/null || true
            cp -r "$shard/base/." "reports/base/$name/" 2>/dev/null || true
            { echo "$name:"; cat "$shard/machine.txt" 2>/dev/null; echo; } >> reports/machine.txt
            for file in pr-number.txt base-sha.txt changed-files.txt; do
              [ -f "$shard/$file" ] && [ ! -f "reports/$file" ] && cp "$shard/$file" reports/
            done
          done
          true

      - name: Write the job summary
        if: always()
        run: |
          if [ -z "$(find reports/head -name '*.json' -print -quit)" ]; then exit 0; fi
          ARGS=(--machine reports/machine.txt --repository "$GITHUB_REPOSITORY")
          if [ -n "$(find reports/base -name '*.json' -print -quit)" ]; then
            ARGS+=(--base reports/base)
          fi
          if [ -f reports/base-sha.txt ]; then
            ARGS+=(--base-sha "$(head -n 1 reports/base-sha.txt)" --head-sha "${{ github.event.pull_request.head.sha }}")
          fi
          if [ -f reports/changed-files.txt ]; then
            ARGS+=(--changed-files reports/changed-files.txt)
          fi
          python3 .github/scripts/benchmark_table.py reports/head "${ARGS[@]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/
