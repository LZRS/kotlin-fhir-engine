# Posts the micro-benchmark table onto the pull request that produced it.
#
# Separate from CI deliberately. A pull request raised from a fork, which is how this repository
# receives them, gets a read-only token, so the job that runs the benchmarks cannot comment however
# its permissions are declared. `workflow_run` fires afterwards in the base repository's context
# with a writable one.
#
# `pull_request_target` would give a single workflow a writable token, but it would then run the
# pull request's own Gradle build with that token and the repository's secrets in scope. Nothing
# here checks out or executes pull request code: it downloads an artifact, renders it with a script
# from the base branch, and posts the result.
#
# The artifact itself is still written by the pull request's run, so everything read out of it is
# untrusted input to a job holding a writable token. The pull request number is validated before it
# reaches a shell or a script, and the table body travels through the environment rather than
# through `${{ }}` interpolation.
name: Benchmark comment

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  comment:
    name: Post benchmark results
    runs-on: ubuntu-latest
    # Pull requests only. A push to main produces the same artifact with nothing to comment on.
    if: github.event.workflow_run.event == 'pull_request'

    steps:
      # The base branch's copy, never the pull request's: this job holds a writable token.
      - uses: actions/checkout@v4

      - name: Download benchmark reports
        uses: actions/download-artifact@v4
        with:
          name: benchmark-reports
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # A failed benchmark job uploads whatever it had, and a cancelled one may upload nothing.
        continue-on-error: true

      - name: Resolve the pull request
        id: pr
        run: |
          # The artifact came out of the pull request's own workflow run, so its contents are
          # written by the pull request's author while this job holds a writable token. Accept a
          # bare decimal and nothing else: a value carrying a newline would add step outputs of
          # its own here, and a value carrying a quote would close the string it is interpolated
          # into below.
          number="$(head -n 1 reports/pr-number.txt 2>/dev/null | tr -d '[:space:]')" || true
          if printf '%s' "$number" | grep -Eq '^[0-9]+$'; then
            echo "number=$number" >> "$GITHUB_OUTPUT"
          else
            echo "No usable pr-number.txt in the artifact; nothing to comment on."
            echo "number=" >> "$GITHUB_OUTPUT"
          fi

      - name: Render the table
        id: table
        if: steps.pr.outputs.number != ''
        run: |
          # The base run may have produced nothing — a base branch that predates the benchmarks,
          # or a failed run — and the script then renders the head alone.
          BASE=""
          if [ -n "$(find reports/base -name '*.json' -print -quit 2>/dev/null)" ]; then
            BASE="--base reports/base"
          fi
          {
            echo 'body<<BENCHMARK_TABLE_EOF'
            python3 .github/scripts/benchmark_table.py reports/head $BASE
            echo ''
            echo "[Full report](${{ github.event.workflow_run.html_url }})"
            echo 'BENCHMARK_TABLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post or update the comment
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- micro-benchmarks -->';
            const body = process.env.BODY;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const { owner, repo } = context.repo;

            // The number named a pull request from inside the artifact, so it names whichever one
            // its author chose rather than necessarily their own. Comment only where the head
            // commit is the one that was benchmarked.
            const { data: pull } = await github.rest.pulls.get({
              owner, repo, pull_number: issue_number,
            });
            if (pull.head.sha !== process.env.HEAD_SHA) {
              core.setFailed(
                `Pull request #${issue_number} is at ${pull.head.sha}, not the benchmarked ` +
                  `${process.env.HEAD_SHA}. Refusing to comment.`,
              );
              return;
            }

            // Update in place rather than adding a comment per push, which would bury a
            // long-running pull request under near-identical tables.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            // Matched on the marker alone, so a table posted by hand from the artifact is updated
            // too rather than joined by a second one.
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          BODY: ${{ steps.table.outputs.body }}
          ISSUE_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
